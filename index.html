<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: una columna tipo formulario de campo (móvil primero), barra fija con logo, reloj UTC−6 y estado de envío.
   Paleta VIDA: celeste #02ABE6 · amarillo #FFC60C · verde #4DBC37 · naranja #FF751F · azul #004AAD */
:root{
  --vida-sky:#02ABE6; --vida-yellow:#FFC60C; --vida-green:#4DBC37; --vida-orange:#FF751F; --vida-navy:#004AAD;
  --bg:#f1f6fa; --surface:#ffffff; --surface-2:#f5f9fc; --ink:#10223a; --muted:#56657a; --line:#d3dde8;
  --accent:#004AAD; --accent-ink:#ffffff; --accent-soft:#e2f4fc; --stamp:#004AAD;
  --warn:#8a5a00; --warn-soft:#fff5d1; --warn-line:#FFC60C;
  --bad:#c2410c; --bad-soft:#ffede3; --ok:#2f8a20; --ok-fill:#4DBC37; --ok-soft:#e7f6e3;
  --logo-bg:transparent;
  --font-ui:'Archivo',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0b1626; --surface:#122238; --surface-2:#172b45; --ink:#e6eef8; --muted:#9aabc2; --line:#26405f;
  --accent:#02ABE6; --accent-ink:#04121f; --accent-soft:#0e3350; --stamp:#8fd8f5;
  --warn:#FFC60C; --warn-soft:#3a2e08; --warn-line:#FFC60C;
  --bad:#ff8a4c; --bad-soft:#3d1e10; --ok:#6fd35a; --ok-fill:#4DBC37; --ok-soft:#173a1a;
  --logo-bg:#ffffff; color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#0b1626; --surface:#122238; --surface-2:#172b45; --ink:#e6eef8; --muted:#9aabc2; --line:#26405f;
  --accent:#02ABE6; --accent-ink:#04121f; --accent-soft:#0e3350; --stamp:#8fd8f5;
  --warn:#FFC60C; --warn-soft:#3a2e08; --warn-line:#FFC60C;
  --bad:#ff8a4c; --bad-soft:#3d1e10; --ok:#6fd35a; --ok-fill:#4DBC37; --ok-soft:#173a1a;
  --logo-bg:#ffffff; color-scheme:dark; }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:16px;line-height:1.45;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.wrap{max-width:680px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* barra */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar::after{content:"";display:block;height:4px;background:linear-gradient(90deg,var(--vida-sky) 0 20%,var(--vida-yellow) 20% 40%,var(--vida-green) 40% 60%,var(--vida-orange) 60% 80%,var(--vida-navy) 80% 100%)}
.bar .wrap{display:flex;align-items:center;gap:12px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.bar .wrap.brandrow{justify-content:space-between;flex-wrap:nowrap;padding-block:10px 2px}
.tt-mark{height:48px;width:auto;display:block;flex:none}
.tt-name{display:grid;gap:2px;min-width:0}
.tt-word{height:24px;width:auto;display:block}
.tt-name span{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.02em;white-space:nowrap}
.vida{height:34px;width:auto;display:block;flex:none;background:var(--logo-bg);border-radius:8px;padding:2px 6px}
.bar .wrap.statusrow{gap:8px;padding-block:4px 8px}
.statusrow .clock{margin-right:auto}
.brand .logo{height:38px;width:auto;display:block;background:var(--logo-bg);border-radius:8px;padding:2px 6px}
.brand b{font-weight:800;letter-spacing:.08em;color:var(--accent);font-size:18px}
.brand span{font-weight:700;color:var(--accent);white-space:nowrap}
.clock{font-size:14px;color:var(--muted)}
.clock strong{color:var(--ink);font-weight:600}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:4px 10px;font-size:13px;font-weight:600;white-space:nowrap}
.pill .dot{width:8px;height:8px;border-radius:50%;background:var(--ok-fill)}
.pill.off .dot{background:var(--warn)}
button.pill{cursor:pointer}
.tabs{display:flex;gap:4px;padding-bottom:8px;overflow-x:auto}
.tabs button{border:0;background:none;padding:6px 12px;border-radius:8px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
.tabs button[aria-current="page"]{background:var(--accent-soft);color:var(--ink)}
.demo{background:var(--warn-soft);color:var(--ink);font-size:14px}
.demo .wrap{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding-block:8px}
.demo label{display:flex;gap:6px;align-items:center;font-weight:600;cursor:pointer}

main{padding-block:16px 120px}
h1{font-size:22px;margin:4px 0 12px;font-weight:800;text-wrap:balance}
h2{font-size:15px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:24px 0 8px;font-weight:700}
.muted{color:var(--muted)}
.small{font-size:13px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);padding:10px 16px;font-weight:600;cursor:pointer;min-height:44px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.ghost{background:none;border-color:transparent;color:var(--accent);padding-inline:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.block{width:100%}
.btn.big{min-height:56px;font-size:18px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* lista */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.stat b{display:block;font-size:24px;font-weight:800}
.stat span{font-size:13px;color:var(--muted)}
.cards{display:grid;gap:8px}
.card{display:grid;grid-template-columns:1fr auto;gap:4px 12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;cursor:pointer;text-align:left;width:100%}
.card:hover{border-color:var(--accent)}
.card .t{font-weight:700}
.card .s{font-size:13px;color:var(--muted);grid-column:1/2;min-width:0;overflow-wrap:anywhere}
.card .e{grid-row:1/3;grid-column:2;text-align:right;display:grid;gap:4px;justify-items:end}
.dots{display:flex;gap:4px}
.dots i{width:10px;height:10px;border-radius:50%;border:2px solid var(--line)}
.dots i.on{background:var(--accent);border-color:var(--accent)}
.chip{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap}
.chip.curso{background:var(--accent-soft);color:var(--ink)}
.chip.pend{background:var(--warn-soft);color:var(--warn)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.catline{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin:-4px 0 12px}
.catline span{min-width:0}
.offline{margin:-6px 0 12px;padding:6px 10px;border-radius:8px;font-weight:600}
.offline.ok{background:var(--ok-soft);color:var(--ok)}
.offline.no{background:var(--warn-soft);color:var(--warn);border:1px solid var(--warn-line)}
.diag{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;font-family:var(--font-mono);font-size:12px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:8px}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:20px;text-align:center;color:var(--muted)}

/* formulario */
.form{display:grid;gap:14px}
.field{display:grid;gap:6px}
.field>label,.field>.lab{font-weight:700;font-size:15px}
.field .num{color:var(--muted);font-weight:600;margin-right:4px}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:10px 12px;min-height:46px}
.field textarea{min-height:84px;resize:vertical}
.field input:disabled,.field select:disabled,.field textarea:disabled{background:var(--surface-2);color:var(--muted)}
.readonly{border:1px dashed var(--line);border-radius:var(--r);padding:10px 12px;background:var(--surface-2)}
.seg{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.seg button{min-height:48px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);font-weight:800;font-size:18px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.seg button:disabled{opacity:.5;cursor:not-allowed}

.times{display:grid;gap:8px}
.trow{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:8px}
.trow.done{border-color:var(--vida-sky);background:linear-gradient(90deg,var(--accent-soft),var(--surface) 70%)}
.trow .tl{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.trow .tl b{font-size:15px}
.trow .tl small{color:var(--muted);font-size:13px}
.stampbtn{width:100%;min-height:56px;border-radius:var(--r);border:2px solid var(--accent);background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:17px;cursor:pointer}
.stampbtn:disabled{background:var(--surface-2);color:var(--muted);border-color:var(--line);cursor:not-allowed}
.stamped{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.stamped .when{font-family:var(--font-mono);font-variant-numeric:tabular-nums;color:var(--stamp);font-size:28px;font-weight:600;letter-spacing:.02em}
.stamped .when small{font-size:13px;color:var(--muted);margin-left:8px;font-weight:500}
.edited{font-size:12px;color:var(--warn);font-weight:700}
.elapsed{font-size:14px;color:var(--muted)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.durs{display:grid;gap:4px}
.durs div{display:flex;justify-content:space-between;gap:12px;font-size:14px;border-bottom:1px dotted var(--line);padding-block:4px}
.durs div:last-child{border-bottom:0}
.durs div.total{border-top:2px solid var(--accent);border-bottom:0;margin-top:4px;padding-top:8px;font-weight:800;font-size:16px;color:var(--stamp)}
.durs span:last-child{font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.alerts{display:grid;gap:6px}
.alert{border-radius:var(--r);padding:8px 12px;font-size:14px;border:1px solid}
.alert.warn{background:var(--warn-soft);border-color:var(--warn-line);color:var(--ink)}
.alert.warn::before{content:"Check · ";font-weight:800;color:var(--warn)}
.alert.info{background:var(--surface-2);border-color:var(--line);color:var(--muted)}
.alert.info::before{content:"Note · ";font-weight:800}
.hist{font-size:13px;display:grid;gap:6px}
.hist div{border-left:3px solid var(--warn);padding-left:8px}
.idline{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.actions{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:4;padding-bottom:env(safe-area-inset-bottom,0px)}
.actions .wrap{display:flex;gap:8px;padding-block:10px}
.actions .wrap .btn{flex:1}

/* tablas */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;font-size:13px;min-width:100%}
th,td{padding:6px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;vertical-align:top}
th{background:var(--surface-2);font-weight:700;position:sticky;top:0}
td.n{font-family:var(--font-mono);font-variant-numeric:tabular-nums}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(5,15,12,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);color:var(--ink);width:100%;max-width:560px;border-radius:16px 16px 0 0;padding:18px max(16px,env(safe-area-inset-left,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px));max-height:90vh;overflow:auto;display:grid;gap:12px}
@media (min-width:640px){.overlay{align-items:center}.sheet{border-radius:16px}}
.sheet h3{margin:0;font-size:19px}
.sheet ul{margin:0;padding-left:20px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;z-index:30;max-width:calc(100% - 32px);text-align:center}
textarea.code{font-family:var(--font-mono);font-size:13px;min-height:130px}
@media (prefers-reduced-motion:no-preference){.trow.done{transition:background .3s}}
</style>

<script>
(function(){
'use strict';
var CFG = Object.assign({API_URL:'', TOKEN:'', ARTIFACT:false}, window.VIDA_CONFIG || {});
var K = {recs:'vida.registros.v1', cat:'vida.catalogos.v2', prefs:'vida.prefs.v1', dev:'vida.dispositivo', sheet:'vida.demo.hoja.v1', hist:'vida.demo.hist.v1'};
var mem = {};
var store = {
  get: function(k, d){ try{ var v = localStorage.getItem(k); if (v != null) return JSON.parse(v); }catch(e){} return (k in mem) ? mem[k] : d; },
  set: function(k, v){ mem[k] = v; try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ return false; } }
};

/* ---------- Hora UTC−6 (Costa Rica / Guatemala), independiente del dispositivo ---------- */
var OFF = -6 * 3600 * 1000;
function pad(n){ return String(n).padStart(2, '0'); }
function parts(ms){ var d = new Date(ms + OFF); return {y:d.getUTCFullYear(), mo:d.getUTCMonth()+1, d:d.getUTCDate(), h:d.getUTCHours(), mi:d.getUTCMinutes(), s:d.getUTCSeconds(), wd:d.getUTCDay()}; }
function fDate(ms){ var p = parts(ms); return p.y + '-' + pad(p.mo) + '-' + pad(p.d); }
function fTime(ms){ var p = parts(ms); return pad(p.h) + ':' + pad(p.mi) + ':' + pad(p.s); }
function fIso(ms){ return fDate(ms) + 'T' + fTime(ms) + '-06:00'; }
function fDT(ms){ return ms == null ? '' : fDate(ms) + ' ' + fTime(ms); }
function parseCR(ds, ts){
  var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec((ds||'').trim()), t = /^(\d{1,2}):(\d{2}):(\d{2})$/.exec((ts||'').trim());
  if (!m || !t) return null;
  var h = +t[1], mi = +t[2], s = +t[3], mo = +m[2], d = +m[3];
  if (h > 23 || mi > 59 || s > 59 || mo < 1 || mo > 12 || d < 1 || d > 31) return null;
  return Date.UTC(+m[1], mo-1, d, h, mi, s) - OFF;
}
var DIAS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
var MESES = ['January','February','March','April','May','June','July','August','September','October','November','December'];
function fLong(ds){ var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(ds); if(!m) return ds; var ms = Date.UTC(+m[1], +m[2]-1, +m[3], 12) - OFF; var p = parts(ms); return DIAS[p.wd] + ', ' + MESES[p.mo-1] + ' ' + p.d + ', ' + p.y; }
function fDur(ms){
  if (ms == null || isNaN(ms)) return '—';
  var neg = ms < 0; ms = Math.abs(ms); var s = Math.round(ms/1000), h = Math.floor(s/3600), m = Math.floor((s%3600)/60), ss = s%60;
  return (neg ? '−' : '') + (h ? h + ' h ' + pad(m) + ' min' : m + ' min ' + pad(ss) + ' s');
}
function mins(a, b){ return (a == null || b == null) ? '' : Math.round((b - a) / 6000) / 10; }
function uuid(){
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  var b = new Uint8Array(16); (window.crypto || {getRandomValues:function(x){for(var i=0;i<x.length;i++)x[i]=Math.random()*256|0;return x;}}).getRandomValues(b);
  b[6] = (b[6] & 15) | 64; b[8] = (b[8] & 63) | 128; var h = Array.from(b, function(x){ return pad(x.toString(16)); }).join('');
  return h.slice(0,8)+'-'+h.slice(8,12)+'-'+h.slice(12,16)+'-'+h.slice(16,20)+'-'+h.slice(20);
}
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

/* ---------- Definiciones ---------- */
var EV = [
  {k:'inicio', n:6, label:'Consultation start time', btn:'Start consultation', hint:'Patient or family arrives at the group'},
  {k:'intake', n:7, label:'Intake form ready time', btn:'Intake form ready', hint:'Volunteers finish the intake form'},
  {k:'medicoLlega', n:9, label:'Doctor start time', btn:'Doctor start', hint:'Doctor arrives at the group; can happen before the intake form is ready'},
  {k:'pacientesSalen', n:10, label:'Last patient dispatch time', btn:'Last patient dispatched', hint:'When the last family member leaves'},
  {k:'medicoSale', n:11, label:'Doctor leaving time', btn:'Doctor leaving', hint:'Independent of the last patient dispatch'}
];
var EVN = {}; EV.forEach(function(e){ EVN[e.k] = e.label; });
var FIELDN = {gira:'Trip Code', comunidad:'Community', interprete:"Interpreter's name", pacientes:'Number of patients', medico:"Doctor's name", complaint:'Main complaint', comentarios:'Observations'};
var COMPLAINTS = ['Problema de salud', 'Revisión general', 'Otro'];
var HEAD = ['ID','Gira','País','Fecha','Comunidad','Intérprete','Pacientes','Inicio atención','Fin intake','Llegada médico','Salida pacientes','Salida médico','Médico','Comentarios','Min inicio→fin intake','Min inicio→llegada médico','Min llegada médico→salida pacientes','Min total paciente','Min médico en grupo','Alertas','Correcciones','Versión','Dispositivo','Creado','Finalizado','Recibido','Motivo de consulta','Min duración total'];
var HEAD_H = ['ID corrección','ID atención','Campo','Valor anterior','Valor nuevo','Motivo','Corregido por','Fecha de corrección','Recibido'];

/* Copia de los catálogos activos del Google Sheet (solo para el modo de prueba; la versión real los descarga sola). */
var SAMPLE = {
  giras:[{codigo:'OTGT072126A', pais:'Guatemala', nombre:''},{codigo:'OTGT072126B', pais:'Guatemala', nombre:''}],
  comunidades:[{nombre:'Santa Cruz', pais:'Costa Rica'},{nombre:'Nicoya', pais:'Costa Rica'},{nombre:'San Lucas Tolimán', pais:'Guatemala'},{nombre:'Santiago Atitlán', pais:'Guatemala'}],
  medicos:[{nombre:'Dra. Ejemplo Solís', pais:'Costa Rica'},{nombre:'Dra. Ejemplo Xocop', pais:'Guatemala'},{nombre:'Dr. Freddy Sánchez', pais:'Guatemala'}],
  interpretes:[],
  actualizado:'2026-11-04T00:00:00-06:00'
};
function normCat(c){ c = c || {}; ['giras','comunidades','medicos','interpretes'].forEach(function(k){ if (!Array.isArray(c[k])) c[k] = []; }); return c; }
function catSig(c){ return JSON.stringify([c.giras, c.comunidades, c.medicos, c.interpretes]); }
var CAT_EVERY = 10 * 60000; // revisar el Google Sheet cada 10 minutos mientras haya internet

/* ---------- Estado ---------- */
var P = store.get(K.prefs, {});
function apiUrl(){ return CFG.API_URL || (!CFG.ARTIFACT && P.apiUrl) || ''; }
function isDemo(){ return !apiUrl(); }
var R = store.get(K.recs, {});
var CAT = normCat(store.get(K.cat, null) || (isDemo() ? JSON.parse(JSON.stringify(SAMPLE)) : {actualizado:null}));
var catBusy = false, catErr = '', catPendingRender = false;
var DEV = store.get(K.dev, null); if (!DEV){ DEV = 'disp-' + uuid().slice(0,8); store.set(K.dev, DEV); }
var view = 'list', cur = null, unlock = null, syncing = false, lastErr = '', lastPress = 0;

function saveR(){ if (!store.set(K.recs, R)) toast('Could not save on this device. Export a backup in Settings.'); }
function saveP(){ store.set(K.prefs, P); }
function online(){ return navigator.onLine !== false && !P.simOffline; }
function synced(r){ return r.syncedVersion === r.version; }
function pending(){ return Object.keys(R).map(function(k){ return R[k]; }).filter(function(r){ return r.finalizada && !synced(r); }); }
/* Limpieza automática: al día siguiente se quitan del teléfono las consultas finalizadas y ya enviadas.
   Nunca se tocan las que están en curso o esperando envío. Ya están en Google Sheets. */
function autoClean(){
  var today = fDate(Date.now()), n = 0;
  Object.keys(R).forEach(function(k){
    var r = R[k];
    if (r.finalizada && synced(r) && r.fecha < today && !(view === 'form' && cur === k)) { delete R[k]; n++; }
  });
  if (n) saveR();
  return n;
}
function giraObj(c){ return CAT.giras.filter(function(g){ return g.codigo === c; })[0] || null; }
function paisOf(r){ var g = giraObj(r.gira); return g ? g.pais : (r.pais || ''); }
function ms(r, k){ return r.t[k] ? r.t[k].ms : null; }

/* ---------- Validaciones (avisan, nunca corrigen) ---------- */
function checks(r){
  var out = [], now = Date.now(), t = function(k){ return ms(r, k); };
  var pairs = [
    ['intake','inicio','Intake end is earlier than the consultation start.'],
    ['medicoLlega','inicio','Doctor arrival is earlier than the consultation start.'],
    ['pacientesSalen','inicio','Patients leaving is earlier than the consultation start.'],
    ['medicoSale','inicio','Doctor leaving is earlier than the consultation start.'],
    ['medicoSale','medicoLlega','Doctor leaving is earlier than doctor arrival.'],
    ['pacientesSalen','medicoLlega','Patients left before the doctor arrived.'],
    ['pacientesSalen','intake','Patients left before intake was finished.']
  ];
  pairs.forEach(function(p){ if (t(p[0]) != null && t(p[1]) != null && t(p[0]) < t(p[1])) out.push({lvl:'warn', msg:p[2]}); });
  if (t('medicoSale') != null && t('medicoLlega') == null) out.push({lvl:'warn', msg:'Doctor leaving is recorded but doctor arrival is not.'});
  EV.forEach(function(e){
    var v = t(e.k); if (v == null) return;
    if (v > now + 120000) out.push({lvl:'warn', msg:EVN[e.k] + ': the time is in the future.'});
    if (fDate(v) !== r.fecha) out.push({lvl:'warn', msg:EVN[e.k] + ': recorded on a different date (' + fDate(v) + ').'});
  });
  var end = Math.max(t('pacientesSalen') || 0, t('medicoSale') || 0);
  if (t('inicio') != null && end && end - t('inicio') > 4 * 3600000) out.push({lvl:'warn', msg:'The consultation lasts more than 4 hours. Check the times.'});
  if (t('medicoLlega') != null && t('intake') != null && t('medicoLlega') < t('intake')) out.push({lvl:'info', msg:'The doctor arrived before intake was finished. Both times are kept.'});
  if (t('medicoSale') != null && t('pacientesSalen') != null && t('medicoSale') < t('pacientesSalen')) out.push({lvl:'info', msg:'The doctor left before the patients. This is valid.'});
  return out;
}
/* Duración total: desde el inicio de la consulta hasta el último evento de salida
   (último paciente o médico, el que ocurra después). Se calcula cuando ambos están registrados. */
function totalDur(r){
  var a = ms(r, 'inicio'), p = ms(r, 'pacientesSalen'), m = ms(r, 'medicoSale');
  return (a == null || p == null || m == null) ? null : Math.max(p, m) - a;
}
function durs(r){
  var t = function(k){ return ms(r, k); }, d = function(a, b){ return (t(a) != null && t(b) != null) ? t(b) - t(a) : null; };
  return [
    ['Consultation start → intake form ready', d('inicio','intake')],
    ['Consultation start → doctor start (wait)', d('inicio','medicoLlega')],
    ['Doctor start → last patient dispatch', d('medicoLlega','pacientesSalen')],
    ['Patient time (start → last patient dispatch)', d('inicio','pacientesSalen')],
    ['Doctor time at the group', d('medicoLlega','medicoSale')],
    ['Total duration', totalDur(r), true]
  ];

/* ---------- Envío / sincronización ---------- */
function sleep(n){ return new Promise(function(res){ setTimeout(res, n); }); }
function sync(manual){
  if (syncing) return Promise.resolve();
  var q = pending();
  if (!q.length){ if (manual) toast('No consultations to send.'); return Promise.resolve(); }
  if (!online()){ if (manual) toast('No internet. Consultations are saved and will be sent automatically.'); return Promise.resolve(); }
  syncing = true; paintBar();
  var snap = q.map(function(r){ return {r:r, v:r.version}; });
  var body = {token:CFG.TOKEN, dispositivo:DEV, registros:q.map(payload)};
  var p = isDemo()
    ? sleep(700).then(function(){ demoReceive(q); return {ok:true}; })
    : fetch(apiUrl(), {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(body), redirect:'follow'}).then(function(res){ return res.json(); });
  return p.then(function(j){
    if (!j || !j.ok) throw new Error((j && j.error) || 'Invalid response');
    var now = fIso(Date.now());
    snap.forEach(function(s){ s.r.syncedVersion = s.v; s.r.enviadoEn = now; });
    saveR(); lastErr = '';
    toast(q.length === 1 ? 'Consultation sent to Google Sheets.' : q.length + ' consultations sent to Google Sheets.');
  }).catch(function(e){ lastErr = String(e.message || e); if (manual) toast('Could not send: ' + lastErr + '. It will retry.'); })
    .then(function(){ syncing = false; paintBar(); if (view === 'list' || view === 'sheet') render(); else if (view === 'form') paintDyn(); });
}
function demoReceive(q){
  var sheet = store.get(K.sheet, {}), hist = store.get(K.hist, {}), now = fDT(Date.now());
  q.forEach(function(r){
    sheet[r.id] = rowOf(r, now);
    r.historial.forEach(function(h){ if (!hist[h.cid]) hist[h.cid] = [h.cid, r.id, h.campoN, h.anterior, h.nuevo, h.motivo, h.por, h.en, now]; });
  });
  store.set(K.sheet, sheet); store.set(K.hist, hist);
}
/* Descarga giras, comunidades, médicos e intérpretes desde el Google Sheet.
   Se ejecuta al abrir la app, al volver a ella, al recuperar internet y cada 10 minutos. */
function refreshCatalogs(manual){
  if (isDemo()){ if (manual) toast('Test view: uses a copy of the Drive lists. The real version downloads them automatically.'); return Promise.resolve(); }
  if (!online()){ if (manual) toast('No internet. Using the lists saved on this phone.'); return Promise.resolve(); }

  return fetch(apiUrl() + (apiUrl().indexOf('?') < 0 ? '?' : '&') + 'action=catalogos&t=' + Date.now(), {redirect:'follow', cache:'no-store'}).then(function(r){ return r.json(); }).then(function(j){
    if (!j.ok) throw new Error(j.error || 'error');
    var next = normCat({giras:j.giras, comunidades:j.comunidades, medicos:j.medicos, interpretes:j.interpretes, actualizado:fIso(Date.now())});
    var changed = catSig(next) !== catSig(CAT);

/* ---------- Modo sin internet (solo en la versión publicada) ----------
   Listo = hay un service worker activo + la página principal guardada en el teléfono.
   La página guarda su propia copia por si el service worker no pudo hacerlo al instalarse. */
var offlineReady = null, offlineWhy = '', offlineTimer = null, offlineTries = 0;
var SHELL_CACHE = 'vida-shell', SHELL_URL = new URL('./', location.href).href;
function swSupported(){ return !CFG.ARTIFACT && 'serviceWorker' in navigator && !!window.caches; }
function saveShell(){
  if (!swSupported() || !online()) return Promise.resolve(false);
  return fetch(SHELL_URL, {cache:'no-store'}).then(function(res){
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return res.blob().then(function(b){
      var copy = new Response(b, {status:200, headers:{'Content-Type':'text/html; charset=utf-8'}});
      return caches.open(SHELL_CACHE).then(function(c){ return c.put(SHELL_URL, copy); }).then(function(){ return true; });
    });
  }).catch(function(e){ offlineWhy = 'Could not save the page: ' + (e.message || e); return false; });
}
function checkOffline(){
  if (!swSupported()){ if (!CFG.ARTIFACT){ offlineReady = false; offlineWhy = 'This browser does not support offline apps. Use Chrome (Android) or Safari (iPhone).'; paintOffline(); } return Promise.resolve(); }
  return navigator.serviceWorker.getRegistration().then(function(reg){
    var active = !!(reg && reg.active);
    return caches.match(SHELL_URL).then(function(hit){
      if (!hit && online()) return saveShell().then(function(){ return caches.match(SHELL_URL); }).then(function(h2){ return [active, !!h2]; });
      return [active, !!hit];
    });
  }).then(function(r){
    offlineReady = r[0] && r[1];
    if (!r[0]) offlineWhy = window.VIDA_SW_ERR ? 'Offline helper failed to start: ' + window.VIDA_SW_ERR : 'Offline helper is still starting.';
    else if (!r[1]) offlineWhy = offlineWhy || 'The page is not saved yet.';
    else offlineWhy = '';
    paintOffline();
    clearTimeout(offlineTimer);
    if (!offlineReady && offlineTries++ < 24) offlineTimer = setTimeout(checkOffline, 5000);  // reintenta cada 5 s, hasta 2 min
  }).catch(function(e){ offlineReady = false; offlineWhy = String(e.message || e); paintOffline(); });
}
function paintOffline(){
  var el = document.getElementById('offLine'); if (!el || offlineReady === null) return;
  el.hidden = false; el.className = 'offline small ' + (offlineReady ? 'ok' : 'no');
  el.textContent = offlineReady ? '✓ Ready to work without internet on this phone'
    : '⚠ Not ready to work offline yet. Keep the app open with internet; this message turns green by itself. If it stays, see Settings → Offline mode.';
}
function offlineDiag(){
  if (CFG.ARTIFACT) return Promise.resolve('This preview does not work offline. Use the published app.');
  if (!('serviceWorker' in navigator)) return Promise.resolve('Service worker: NOT supported by this browser.\nBrowser: ' + navigator.userAgent);
  return Promise.all([navigator.serviceWorker.getRegistration(), window.caches ? caches.keys() : Promise.resolve([]), window.caches ? caches.match(SHELL_URL) : Promise.resolve(null)]).then(function(r){
    var reg = r[0], st = function(w){ return w ? w.state + ' (' + w.scriptURL.split('/').pop() + ')' : '—'; };
    return ['Ready offline: ' + (offlineReady ? 'YES' : 'NO') + (offlineWhy ? ' — ' + offlineWhy : ''),
      'Registration: ' + (reg ? 'yes, scope ' + reg.scope : 'NO'),
      'Active: ' + st(reg && reg.active), 'Waiting: ' + st(reg && reg.waiting), 'Installing: ' + st(reg && reg.installing),
      'Controls this page: ' + (navigator.serviceWorker.controller ? 'yes' : 'no'),
      'Register error: ' + (window.VIDA_SW_ERR || 'none'),
      'Caches: ' + (r[1].join(', ') || 'none'), 'Page saved: ' + (r[2] ? 'yes' : 'NO'),
      'Online: ' + (navigator.onLine ? 'yes' : 'no'), 'Browser: ' + navigator.userAgent].join('\n');
  });
}
if (swSupported()){
  navigator.serviceWorker.ready.then(function(){ setTimeout(checkOffline, 1000); });
  navigator.serviceWorker.addEventListener('controllerchange', function(){ setTimeout(checkOffline, 1000); });
}

    var neverSent = r.syncedVersion === 0;
    a.innerHTML = (neverSent ? '<button class="btn danger" type="button" id="discardBtn" style="flex:0 0 auto">Discard</button>' : '') + '<button class="btn primary" type="button" id="finBtn">Finish and send</button>';
    if (neverSent) $('#discardBtn').onclick = function(){ confirmBox('Discard this consultation?', '<p>It will be deleted from this device. Use this only if it was created by mistake.</p>', 'Discard', function(){ delete R[r.id]; saveR(); go('list'); toast('Consultation discarded.'); }, true); };
    $('#finBtn').onclick = finalize;
  } else if (locked(r)) {
    a.innerHTML = '<button class="btn" type="button" id="unlockBtn">Correct details</button><button class="btn primary" type="button" data-nav="list">Done</button>';
    $('#unlockBtn').onclick = askUnlock;
  } else {
    a.innerHTML = '<button class="btn primary" type="button" id="relockBtn">Save correction</button>';
    $('#relockBtn').onclick = function(){ unlock = null; renderForm(); sync(); toast('Correction saved.'); };
  }
}
function bump(r){ r.version++; r.modificado = fIso(Date.now()); saveR(); paintBar(); }
var syncT; function syncSoon(){ clearTimeout(syncT); syncT = setTimeout(function(){ sync(); }, 2500); }
function setField(f, v){
  var r = R[cur]; if (!r || locked(r)) return;
  if (f === 'pacientes') v = +v;
  var old = r[f]; if (old === v) return;
  if (r.finalizada && unlock){
    var last = r.historial[r.historial.length - 1];
    if (last && last.campo === f && last.sesion === unlock.sesion) last.nuevo = String(v);  // agrupa lo tecleado en una sola corrección
    else r.historial.push({cid:uuid(), campo:f, campoN:FIELDN[f], anterior:String(old == null ? '' : old), nuevo:String(v), motivo:unlock.motivo, en:fIso(Date.now()), por:r.interprete, sesion:unlock.sesion});
  }
  r[f] = v;
  if (f === 'gira' || f === 'comunidad' || f === 'interprete'){ P[f] = v; saveP(); }
  bump(r);
  if (f === 'gira'){ var keep = document.activeElement && document.activeElement.id; renderForm(); if (keep && $('#' + keep)) $('#' + keep).focus(); return; }
  if (f === 'pacientes') Array.prototype.forEach.call(document.querySelectorAll('#pacSeg button'), function(b){ b.setAttribute('aria-pressed', String(+b.dataset.pac === v)); });
  paintDyn();
  if (r.finalizada) syncSoon();
}
function stamp(k){
  var r = R[cur]; if (!r) return;
  var now = Date.now();
  if (now - lastPress < 800) return; lastPress = now;
  if (r.t[k]){ toast('This time is already recorded. Use “Correct” if there is a mistake.'); return; }
  if (k !== 'inicio' && !r.t.inicio){ toast('First tap “Start consultation”.'); return; }
  r.t[k] = {ms:now, iso:fIso(now)};
  if (k === 'inicio') r.fecha = fDate(now);
  bump(r); paintDyn();
  try{ navigator.vibrate && navigator.vibrate(40); }catch(e){}
  toast(EVN[k] + ': ' + fTime(now));
  if (r.finalizada) syncSoon();
}
function maskTime(el){
  el.addEventListener('input', function(){ var d = el.value.replace(/\D/g, '').slice(0, 6); el.value = d.length > 4 ? d.slice(0,2)+':'+d.slice(2,4)+':'+d.slice(4) : d.length > 2 ? d.slice(0,2)+':'+d.slice(2) : d; });
}
function fixTime(k){
  var r = R[cur], v = r.t[k], base = v ? v.ms : Date.now();
  openModal('<h3>' + (v ? 'Correct' : 'Enter') + ' time</h3><p class="muted" style="margin:0">' + esc(EVN[k]) + '</p>' +
    (v ? '<div class="readonly">Recorded time: <span class="mono">' + fDT(v.ms) + '</span></div>' : '') +
    '<div class="row"><div class="field" style="flex:1;min-width:140px"><label for="cDate">Date (YYYY-MM-DD)</label><input id="cDate" class="mono" inputmode="numeric" value="' + fDate(base) + '"></div>' +
    '<div class="field" style="flex:1;min-width:140px"><label for="cTime">24-hour time (HH:MM:SS)</label><input id="cTime" class="mono" inputmode="numeric" placeholder="14:05:30" value="' + fTime(base) + '" autofocus></div></div>' +
    '<button class="btn ghost" type="button" id="cNow" style="justify-self:start">Use current time</button>' +
    (v ? '<label class="row small"><input type="checkbox" id="cClear"> Clear this time (tapped by mistake)</label>' : '') +
    '<div class="field"><label for="cWhy">Reason for the correction (required)</label><textarea id="cWhy" placeholder="E.g. the button was tapped late; the patient left at 10:42"></textarea></div>' +
    '<div class="alert warn" id="cErr" hidden></div>' +
    '<div class="row"><button class="btn" type="button" id="mCancel">Cancel</button><button class="btn primary" type="button" id="cSave" style="flex:1">Save correction</button></div>');
  maskTime($('#cTime'));
  $('#mCancel').onclick = closeModal;
  $('#cNow').onclick = function(){ var n = Date.now(); $('#cDate').value = fDate(n); $('#cTime').value = fTime(n); };
  $('#cSave').onclick = function(){
    var why = $('#cWhy').value.trim(), clear = $('#cClear') && $('#cClear').checked, err = $('#cErr');
    var nv = clear ? null : parseCR($('#cDate').value, $('#cTime').value);
    if (why.length < 4){ err.textContent = 'Write the reason for the correction.'; err.hidden = false; return; }
    if (!clear && nv == null){ err.textContent = 'Check the date (YYYY-MM-DD) and the time (HH:MM:SS, from 00:00:00 to 23:59:59).'; err.hidden = false; return; }
    if (v && nv === v.ms){ err.textContent = 'The time is the same as the recorded one.'; err.hidden = false; return; }
    r.historial.push({cid:uuid(), campo:k, campoN:EVN[k], anterior:v ? fDT(v.ms) : '', nuevo:nv == null ? '' : fDT(nv), motivo:why, en:fIso(Date.now()), por:r.interprete});
    if (nv == null) delete r.t[k]; else r.t[k] = {ms:nv, iso:fIso(nv), corregida:true};
    if (k === 'inicio' && nv != null) r.fecha = fDate(nv);
    bump(r); closeModal(); renderForm(); toast('Correction saved in the history.');
    if (r.finalizada) syncSoon();
  };
}
function askUnlock(){
  openModal('<h3>Correct details of a finished consultation</h3><p class="muted" style="margin:0">Changes are saved in the history with this reason and sent to the sheet again.</p>' +
    '<div class="field"><label for="uWhy">Reason (required)</label><textarea id="uWhy" autofocus placeholder="E.g. the wrong doctor was selected"></textarea></div><div class="alert warn" id="uErr" hidden>Write the reason.</div>' +
    '<div class="row"><button class="btn" type="button" id="mCancel">Cancel</button><button class="btn primary" type="button" id="uOk" style="flex:1">Allow editing</button></div>');
  $('#mCancel').onclick = closeModal;
  $('#uOk').onclick = function(){ var w = $('#uWhy').value.trim(); if (w.length < 4){ $('#uErr').hidden = false; return; } unlock = {id:cur, motivo:w, sesion:uuid()}; closeModal(); renderForm(); };
}
function finalize(){
  var r = R[cur], md = missingData(r);
  if (md.length){ openModal('<h3>Missing details</h3><ul>' + md.map(function(x){ return '<li>' + esc(x) + '</li>'; }).join('') + '</ul><button class="btn primary" type="button" id="mCancel">Complete them</button>'); $('#mCancel').onclick = closeModal; return; }
  var mt = missingTimes(r), al = checks(r).filter(function(a){ return a.lvl === 'warn'; });
  var done = function(){
    r.finalizada = true; r.finalizadaEn = fIso(Date.now()); bump(r);
    go('list'); toast(online() ? 'Consultation finished. Sending…' : 'Consultation saved. It will be sent when there is internet.'); sync();
  };
  if (!mt.length && !al.length) return done();
  var html = '';
  if (mt.length) html += '<p><b>Missing times:</b></p><ul>' + mt.map(function(x){ return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>' + (r.comentarios.trim() ? '' : '<div class="alert warn">To send without all the times, explain why in “Final comments”.</div>');
  if (al.length) html += '<p><b>Times to check:</b></p><ul>' + al.map(function(a){ return '<li>' + esc(a.msg) + '</li>'; }).join('') + '</ul><p class="muted small">The data is sent as it is; the alerts are noted in the sheet.</p>';
  confirmBox('Check before sending', html, mt.length ? 'Send incomplete' : 'Send with alerts', done);
  if (mt.length && !r.comentarios.trim()) $('#mOk').disabled = true;
}

/* ---------- Hoja simulada ---------- */
function table(head, rows, numFrom){
  return '<div class="tablewrap"><table><thead><tr>' + head.map(function(h){ return '<th>' + esc(h) + '</th>'; }).join('') + '</tr></thead><tbody>' +
    (rows.length ? rows.map(function(r){ return '<tr>' + r.map(function(c, i){ return '<td' + (i >= 7 && i <= 11 || (numFrom && i >= numFrom[0] && i <= numFrom[1]) ? ' class="n"' : '') + '>' + esc(c) + '</td>'; }).join('') + '</tr>'; }).join('') : '<tr><td colspan="' + head.length + '" class="muted">No rows yet.</td></tr>') + '</tbody></table></div>';
}
function renderSheet(){
  var sheet = store.get(K.sheet, {}), hist = store.get(K.hist, {});
  var rows = Object.keys(sheet).map(function(k){ return sheet[k]; }).sort(function(a, b){ return a[7] < b[7] ? -1 : 1; });
  var hrows = Object.keys(hist).map(function(k){ return hist[k]; });
  V.innerHTML = '<h1>Google Sheets preview</h1><p class="muted">This is how rows look in the “Atenciones” sheet once sent. Each consultation is one row; if it is corrected later, the same row is updated by its ID. Column names match your Google Sheet.</p>' +
    table(HEAD, rows, [14, 18]) + '<h2>“Historial_correcciones” sheet</h2>' + table(HEAD_H, hrows);
}

/* ---------- Ajustes ---------- */
function catText(){
  return {
    giras: CAT.giras.map(function(g){ return [g.codigo, g.pais, g.nombre || ''].join(' | '); }).join('\n'),
    comunidades: CAT.comunidades.map(function(c){ return c.nombre + ' | ' + c.pais; }).join('\n'),
    medicos: CAT.medicos.map(function(m){ return m.nombre + ' | ' + m.pais; }).join('\n'),
    interpretes: CAT.interpretes.map(function(m){ return m.nombre + ' | ' + m.pais; }).join('\n')
  };
}
function catList(){
  var block = function(t, list, fn){ return '<details><summary class="small"><b>' + t + '</b> (' + list.length + ')</summary><div class="small" style="padding:6px 0 0 14px">' +
    (list.length ? list.map(function(x){ return esc(fn(x)); }).join('<br>') : '<span class="muted">None active</span>') + '</div></details>'; };
  return block('Trips', CAT.giras, function(g){ return g.codigo + ' · ' + g.pais + (g.nombre ? ' · ' + g.nombre : ''); }) +
    block('Communities', CAT.comunidades, function(c){ return c.nombre + ' · ' + c.pais; }) +
    block('Doctors', CAT.medicos, function(m){ return m.nombre + ' · ' + m.pais; }) +
    block('Interpreters', CAT.interpretes, function(m){ return m.nombre + (m.pais ? ' · ' + m.pais : ''); });
}
function csv(){
  var rows = [HEAD].concat(Object.keys(R).map(function(k){ return rowOf(R[k], R[k].enviadoEn || ''); }));
  return rows.map(function(r){ return r.map(function(c){ c = String(c == null ? '' : c); return /[",\n;]/.test(c) ? '"' + c.replace(/"/g, '""') + '"' : c; }).join(','); }).join('\n');
}
function renderSettings(){
  var demo = isDemo(), ct = catText();
  V.innerHTML = '<h1>Settings</h1>' +
    '<h2>Lists</h2><div class="panel form">' +
    (demo
      ? '<p class="small muted" style="margin:0">This preview uses a copy of the active lists in your Google Sheet. The real version downloads them automatically from the “Giras”, “Comunidades”, “Medicos” and “Interpretes” tabs. You can edit them here to test. One item per line, separated by “|”.</p>' +
        '<div class="field"><label for="cGiras">Trips: code | country | description</label><textarea class="code" id="cGiras">' + esc(ct.giras) + '</textarea></div>' +
        '<div class="field"><label for="cCom">Communities: name | country</label><textarea class="code" id="cCom">' + esc(ct.comunidades) + '</textarea></div>' +
        '<div class="field"><label for="cMed">Doctors: name | country</label><textarea class="code" id="cMed">' + esc(ct.medicos) + '</textarea></div>' +
        '<div class="field"><label for="cInt">Interpreters (optional, suggestions): name | country</label><textarea class="code" id="cInt">' + esc(ct.interpretes) + '</textarea></div>' +
        '<div class="row"><button class="btn primary" type="button" id="catSave">Save lists</button><button class="btn" type="button" id="catReset">Restore Drive copy</button></div>'
      : '<p style="margin:0">' + esc(catSummary()) + '.<br><span class="muted small">They are edited in the Google Sheet. The app checks for changes when it opens and every 10 minutes when online. Only rows with “Activo” ticked appear.' + (catErr ? ' Last error: ' + esc(catErr) : '') + '</span></p>' +
        '<button class="btn primary" type="button" id="catFetch">Update lists now</button>' + catList()) +
    '</div>' +
    '<h2>Google Sheets connection</h2><div class="panel form">' +
    (CFG.ARTIFACT ? '<p class="small" style="margin:0">This preview cannot connect to Google. The real connection is set in the <span class="mono">index.html</span> file of the deployment package.</p>'
      : '<div class="field"><label for="apiIn">Apps Script web app URL</label><input id="apiIn" class="mono" placeholder="https://script.google.com/macros/s/…/exec" value="' + esc(CFG.API_URL || P.apiUrl || '') + '"' + (CFG.API_URL ? ' disabled' : '') + '></div>' +
        (CFG.API_URL ? '<p class="small muted" style="margin:0">Set in index.html.</p>' : '<button class="btn" type="button" id="apiSave">Save URL</button>')) +
    '<p class="small" style="margin:0">Status: ' + (demo ? 'test mode (no real connection)' : 'connected to Google Sheets') + (lastErr ? ' · last error: ' + esc(lastErr) : '') + '</p>' +
    '<button class="btn" type="button" id="syncNow">Send pending now (' + pending().length + ')</button></div>' +
    (CFG.ARTIFACT ? '' : '<h2>Offline mode</h2><div class="panel form"><pre class="diag" id="diagBox">Checking…</pre><div class="row"><button class="btn primary" type="button" id="repairBtn">Repair offline mode</button><button class="btn" type="button" id="diagCopy">Copy details</button></div></div>') +
    '<h2>Backup</h2><div class="panel form"><p class="small muted" style="margin:0">Backup of all consultations saved on this device, as a CSV file (opens in Excel or Sheets).</p>' +
    '<div class="row"><button class="btn" type="button" id="csvCopy">Copy CSV</button>' + (CFG.ARTIFACT ? '' : '<button class="btn" type="button" id="csvDl">Download CSV</button>') + '</div></div>' +
    '<h2>This device</h2><div class="panel form"><p class="small" style="margin:0">Device ID: <span class="mono">' + esc(DEV) + '</span> · ' + Object.keys(R).length + ' consultations saved.</p>' +
    '<p class="small muted" style="margin:0">Consultations already sent are removed from this phone automatically the next day. They stay in Google Sheets. Consultations in progress or waiting to be sent are never removed.</p></div>';
  if (demo){
    $('#catSave').onclick = function(){

      CAT = {giras:lines('cGiras').map(function(p){ return {codigo:p[0], pais:p[1] || '', nombre:p[2] || ''}; }),
        comunidades:lines('cCom').map(function(p){ return {nombre:p[0], pais:p[1] || ''}; }),
        medicos:lines('cMed').map(function(p){ return {nombre:p[0], pais:p[1] || ''}; }),
        interpretes:lines('cInt').map(function(p){ return {nombre:p[0], pais:p[1] || ''}; }), actualizado:fIso(Date.now())};
      store.set(K.cat, CAT); toast('Lists saved.');
    };
    $('#catReset').onclick = function(){ CAT = normCat(JSON.parse(JSON.stringify(SAMPLE))); store.set(K.cat, CAT); renderSettings(); toast('Drive copy restored.'); };
  } else $('#catFetch').onclick = function(){ refreshCatalogs(true).then(renderSettings); };
  if ($('#apiSave')) $('#apiSave').onclick = function(){ P.apiUrl = $('#apiIn').value.trim(); saveP(); if (P.apiUrl){ CAT = normCat({actualizado:null}); store.set(K.cat, CAT); refreshCatalogs(true); } render(); };
  $('#syncNow').onclick = function(){ sync(true); };
  if ($('#diagBox')){
    var showDiag = function(){ offlineDiag().then(function(t){ var b = $('#diagBox'); if (b) b.textContent = t; }); };
    showDiag();
    $('#repairBtn').onclick = function(){
      if (!online()) return toast('Connect to the internet first.');
      toast('Repairing…'); offlineTries = 0;
      var reg = navigator.serviceWorker ? navigator.serviceWorker.getRegistration() : Promise.resolve(null);
      reg.then(function(r){ return r ? r.update().catch(function(){}) : navigator.serviceWorker.register('sw.js').catch(function(e){ window.VIDA_SW_ERR = e.message || String(e); }); })
        .then(saveShell).then(checkOffline).then(function(){ showDiag(); toast(offlineReady ? 'Ready to work without internet.' : 'Still not ready. Copy the details and send them to your coordinator.'); });

/* ---------- Eventos ---------- */
document.addEventListener('click', function(e){
  var t = e.target.closest('[data-nav],[data-open],[data-stamp],[data-fix],[data-pac]'); if (!t) return;
  if (t.dataset.nav) return go(t.dataset.nav);
  if (t.dataset.open) return go('form', t.dataset.open);
  if (t.dataset.stamp) return stamp(t.dataset.stamp);
  if (t.dataset.fix) return fixTime(t.dataset.fix);
  if (t.dataset.pac) return setField('pacientes', t.dataset.pac);
});
V.addEventListener('change', function(e){ var f = e.target.dataset && e.target.dataset.f; if (f && e.target.tagName === 'SELECT') setField(f, e.target.value); });
V.addEventListener('input', function(e){ var f = e.target.dataset && e.target.dataset.f; if (f && e.target.tagName !== 'SELECT') setField(f, e.target.value); });
$('#syncBtn').onclick = function(){ sync(true); };
$('#simOff').onchange = function(e){ P.simOffline = e.target.checked; saveP(); paintBar(); toast(P.simOffline ? 'Simulating no internet: consultations wait in the queue.' : 'Connection restored. Sending pending consultations…'); if (!P.simOffline) sync(); };
window.addEventListener('online', function(){ paintBar(); sync(); refreshCatalogs(); });
document.addEventListener('visibilitychange', function(){
  if (document.visibilityState === 'visible' && Date.now() - (Date.parse(CAT.actualizado || 0) || 0) > 60000) refreshCatalogs();
});
V.addEventListener('focusout', function(){ if (catPendingRender && view === 'form') setTimeout(function(){ var a = document.activeElement; if (!a || (a.tagName !== 'INPUT' && a.tagName !== 'TEXTAREA')){ catPendingRender = false; renderForm(); } }, 50); });
setInterval(function(){ refreshCatalogs(); }, CAT_EVERY);
window.addEventListener('offline', paintBar);
window.addEventListener('storage', function(e){ if (e.key === K.recs){ R = store.get(K.recs, {}); if (view !== 'form') render(); } });

setInterval(function(){
  var now = Date.now();
  $('#clock').textContent = fTime(now);
  Array.prototype.forEach.call(document.querySelectorAll('[data-since]'), function(el){ el.textContent = fDur(now - +el.dataset.since); });
}, 1000);
setInterval(function(){ sync(); if (autoClean() && view === 'list') render(); }, 30000);
$('#clock').textContent = fTime(Date.now());

/* ejemplo inicial para la vista previa */
if (CFG.ARTIFACT && !store.get('vida.demo.sembrado.v4', false) && !Object.keys(R).length){

    t:{inicio:{ms:b, iso:fIso(b)}, intake:{ms:b+14*60000+12000, iso:fIso(b+14*60000+12000)}, medicoLlega:{ms:b+11*60000+40000, iso:fIso(b+11*60000+40000)}, pacientesSalen:{ms:b+38*60000+5000, iso:fIso(b+38*60000+5000)}, medicoSale:{ms:b+36*60000+50000, iso:fIso(b+36*60000+50000)}},
    medico:'Dra. Ejemplo Xocop', complaint:'Revisión general', comentarios:'Sample: the doctor arrived before intake was finished.', historial:[], finalizada:true, finalizadaEn:fIso(b+39*60000), version:2, syncedVersion:0, dispositivo:DEV};
  var c = Date.now() - 9 * 60000;
  R[id2] = {id:id2, creadoMs:c, creado:fIso(c), fecha:fDate(c), gira:'OTGT072126A', comunidad:'Santiago Atitlán', interprete:'Sample interpreter', pacientes:1,
    t:{inicio:{ms:c, iso:fIso(c)}}, medico:'', comentarios:'', historial:[], finalizada:false, finalizadaEn:null, version:2, syncedVersion:0, dispositivo:DEV};
  P.gira = 'OTGT072126A'; P.comunidad = 'Santiago Atitlán'; P.interprete = 'Sample interpreter'; saveP(); saveR(); store.set('vida.demo.sembrado.v4', true);
}
autoClean();
render();
sync(); refreshCatalogs(); checkOffline();
})();
